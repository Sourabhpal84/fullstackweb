<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Order History</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="rider-finance.css"></head><body><main class="wrap"><header class="head"><div><h1>Order History</h1><p>Permanent delivered-order records.</p></div><button onclick="location.href='rider-dashboard.html'">Dashboard</button></header><section class="cards" id="summary"></section><section class="list" id="list"></section></main><script type="module">
import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{collection,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0),dt=v=>v?.toDate?.().toLocaleString("en-IN")||"Delivered";
onAuthStateChanged(auth,u=>{if(!u)return location.replace("rider-login.html");onSnapshot(query(collection(db,"riderOrderHistory"),where("riderId","==",u.uid)),s=>{const a=s.docs.map(d=>d.data()).sort((x,y)=>(y.deliveryTime?.toMillis?.()||0)-(x.deliveryTime?.toMillis?.()||0)),earn=a.reduce((n,x)=>n+Number(x.riderEarning||0),0),cash=a.reduce((n,x)=>n+Number(x.cashCollected||0),0);summary.innerHTML=`<div class="card"><b>${a.length}</b><span>Delivered Orders</span></div><div class="card"><b>${money(earn)}</b><span>Total Earnings</span></div><div class="card"><b>${money(cash)}</b><span>Cash Collected</span></div><div class="card"><b>${money(a.length?earn/a.length:0)}</b><span>Average / Order</span></div>`;list.innerHTML=a.map(x=>`<article class="row"><div><b>#${x.orderNumber}</b><div class="muted">${x.customerName}</div></div><span>${x.distance||0} km</span><span>${money(x.orderAmount)}</span><span>${x.paymentMethod}</span><b class="credit">${money(x.riderEarning)}</b><span>${dt(x.deliveryTime)}<br>${x.settlementStatus||""}</span></article>`).join("")||'<div class="empty">No delivered orders yet.</div>'})});</script></body></html>
