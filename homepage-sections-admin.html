<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homepage Sections | MAGNEETOZ Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081018;color:#f8fafc;font-family:Poppins,system-ui,sans-serif}.admin-auth-checking body{display:none}
main{width:min(1200px,calc(100% - 28px));margin:auto;padding:20px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#fbbf24;text-decoration:none;font-weight:800}
.panel,.section-card{background:#111b27;border:1px solid #28384a;border-radius:8px;padding:16px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#b8c5d4}input,textarea,select{width:100%;padding:11px;border:1px solid #34465b;border-radius:7px;background:#07101a;color:white;font:inherit}textarea{min-height:75px}
button{border:0;border-radius:7px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:#22c55e;color:#05210e}.soft{background:#253448;color:white}.danger{background:#ef4444;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.products{max-height:430px;overflow:auto;display:grid;gap:8px;margin-top:10px}.product-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:8px;border:1px solid #29384b;border-radius:7px}.product-row img{width:48px;height:48px;object-fit:cover;border-radius:6px}.product-row input{width:20px}.muted{color:#94a3b8;font-size:12px}.selected-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.selected-chip{display:flex;align-items:center;gap:5px;padding:6px 8px;background:#26364a;border-radius:7px;font-size:11px;font-weight:800}.section-card h3{margin:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#26364a;font-size:10px}.active{background:#22c55e;color:#05210e}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
  <header class="top"><div><h1>Homepage Sections</h1><p class="muted">Existing menu and cart flow is reused automatically.</p></div><a href="super-admin-dashboard.html">Back to dashboard</a></header>
  <section class="panel">
    <form id="sectionForm">
      <input type="hidden" id="sectionId">
      <div class="grid">
        <label>Section title<input id="title" required placeholder="Recommended Pizzas"></label>
        <label>Subtitle<input id="subtitle" placeholder="Popular pizzas near you"></label>
        <label>Display order<input id="displayOrder" type="number" min="0" value="1" required></label>
        <label>Section type<select id="sectionType"><option value="manual">Manual</option><option value="best_seller">Best Seller</option><option value="trending">Trending</option><option value="new_launch">New Launch</option></select></label>
        <label>Status<select id="activeStatus"><option value="true">Active</option><option value="false">Inactive</option></select></label>
        <label>Filter products<input id="productSearch" placeholder="Search name or category"></label>
        <label>Category filter<select id="categoryFilter"><option value="">All categories</option></select></label>
      </div>
      <label style="margin-top:12px">Selected product order</label>
      <div class="selected-list" id="selectedList"></div>
      <div class="products" id="productList"></div>
      <div class="actions"><button class="primary" type="submit">Save section</button><button class="soft" type="button" id="resetForm">New section</button></div>
    </form>
  </section>
  <section id="sectionsList"></section>
</main>
<script type="module">
import { protectAdminPage, mountAdminLogout } from "./admin-guard.js";
import { db } from "./firebase-config.js";
import { addDoc, collection, deleteDoc, doc, onSnapshot, orderBy, query, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
protectAdminPage(); mountAdminLogout(document.querySelector(".top"));
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
let dishes=[], sections=[], selectedIds=[];
const byId = id => dishes.find(item => item.id === id);
function priceText(d){if(d.type==="simple") return `Rs ${Number(d.price||0)}`;const prices=Object.values(d.sizes||{}).map(v=>Number(typeof v==="object"?v.price:v)).filter(Number.isFinite);return prices.length?`From Rs ${Math.min(...prices)}`:"Size based";}
function renderSelected(){selectedList.innerHTML=selectedIds.map((id,index)=>{const d=byId(id);return d?`<span class="selected-chip">${index+1}. ${esc(d.name)} <button type="button" class="soft" onclick="moveProduct('${id}',-1)">↑</button><button type="button" class="soft" onclick="moveProduct('${id}',1)">↓</button><button type="button" class="danger" onclick="toggleProduct('${id}',false)">×</button></span>`:""}).join("")||"<span class='muted'>No products selected.</span>";}
function renderProducts(){const term=productSearch.value.trim().toLowerCase(),category=categoryFilter.value;productList.innerHTML=dishes.filter(d=>(!term||`${d.name} ${d.category}`.toLowerCase().includes(term))&&(!category||d.category===category)).map(d=>`<label class="product-row"><img src="${esc(d.image||"logo_tran.jpeg")}" alt=""><span><b>${esc(d.name||"Dish")}</b><br><small class="muted">${esc(d.category||"Uncategorized")} · ${esc(priceText(d))} · ${d.available?"Active":"Inactive"}</small></span><input type="checkbox" ${selectedIds.includes(d.id)?"checked":""} ${d.available?"":"disabled"} onchange="toggleProduct('${d.id}',this.checked)"></label>`).join("")||"<p class='muted'>No matching products.</p>";}
window.toggleProduct=(id,checked)=>{selectedIds=checked?[...selectedIds.filter(x=>x!==id),id]:selectedIds.filter(x=>x!==id);renderProducts();renderSelected();};
window.moveProduct=(id,direction)=>{const index=selectedIds.indexOf(id),next=index+direction;if(index<0||next<0||next>=selectedIds.length)return;[selectedIds[index],selectedIds[next]]=[selectedIds[next],selectedIds[index]];renderSelected();};
function reset(){sectionForm.reset();sectionId.value="";displayOrder.value=sections.length+1;activeStatus.value="true";selectedIds=[];renderProducts();renderSelected();}
function renderSections(){sectionsList.innerHTML=sections.map(s=>`<article class="section-card"><h3>${esc(s.title||"Untitled")}</h3><p class="muted">${esc(s.subtitle||"")} · Order ${Number(s.order||0)} · ${s.productIds?.length||0} products</p><span class="badge ${s.active!==false?"active":""}">${s.active!==false?"Active":"Inactive"}</span><div class="actions"><button class="soft" onclick="editSection('${s.id}')">Edit</button><button class="soft" onclick="toggleSection('${s.id}',${s.active===false})">${s.active===false?"Activate":"Deactivate"}</button><button class="danger" onclick="removeSection('${s.id}')">Delete</button></div></article>`).join("")||"<div class='panel muted'>No homepage sections yet.</div>";}
window.editSection=id=>{const s=sections.find(item=>item.id===id);if(!s)return;sectionId.value=id;title.value=s.title||"";subtitle.value=s.subtitle||"";displayOrder.value=Number(s.order||0);sectionType.value=s.sectionType||"manual";activeStatus.value=String(s.active!==false);selectedIds=(s.productIds||[]).filter(id=>byId(id));renderProducts();renderSelected();scrollTo({top:0,behavior:"smooth"});};
window.toggleSection=(id,active)=>updateDoc(doc(db,"homepageSections",id),{active,updatedAt:serverTimestamp()});
window.removeSection=async id=>{if(confirm("Delete this homepage section?"))await deleteDoc(doc(db,"homepageSections",id));};
sectionForm.addEventListener("submit",async event=>{event.preventDefault();if(!selectedIds.length){alert("Select at least one active product.");return;}const payload={title:title.value.trim(),subtitle:subtitle.value.trim(),order:Number(displayOrder.value||0),active:activeStatus.value==="true",sectionType:sectionType.value,productIds:selectedIds,updatedAt:serverTimestamp()};if(sectionId.value)await updateDoc(doc(db,"homepageSections",sectionId.value),payload);else await addDoc(collection(db,"homepageSections"),{...payload,createdAt:serverTimestamp()});reset();});
resetForm.onclick=reset;productSearch.oninput=renderProducts;categoryFilter.onchange=renderProducts;
onSnapshot(collection(db,"dishes"),snapshot=>{dishes=snapshot.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));const categories=[...new Set(dishes.map(d=>d.category).filter(Boolean))].sort();categoryFilter.innerHTML='<option value="">All categories</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");renderProducts();renderSelected();});
onSnapshot(query(collection(db,"homepageSections"),orderBy("order","asc")),snapshot=>{sections=snapshot.docs.map(d=>({id:d.id,...d.data()}));renderSections();if(!sectionId.value)displayOrder.value=sections.length+1;});
</script>
</body>
</html>
