<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Rider Withdrawals Admin</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="rider-finance.css"></head><body><main class="wrap"><header class="head"><div><h1>Withdrawal Requests</h1><p>Review UPI withdrawals after manually transferring funds.</p></div></header><section class="list" id="list"></section></main><script type="module">import{protectAdminPage,mountAdminLogout}from"./admin-guard.js";import{auth,db}from"./firebase-config.js";import{getIdToken}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{collection,onSnapshot,orderBy,query}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";protectAdminPage();mountAdminLogout(document.querySelector(".head"));const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0),dt=v=>v?.toDate?.().toLocaleString("en-IN")||"Pending";onSnapshot(query(collection(db,"riderWithdrawals"),orderBy("requestedAt","desc")),s=>list.innerHTML=s.docs.map(d=>{const x=d.data();return `<article class="row"><div><b>${x.riderName||x.riderId}</b><div class="muted">${x.upiId}</div></div><b>${money(x.amount)}</b><span>${dt(x.requestedAt)}</span><b>${x.status}</b><span>${x.transactionId||x.rejectionReason||""}</span><div>${x.status==="pending"?`<button onclick="processRequest('${d.id}','approved')">Approve</button> <button onclick="processRequest('${d.id}','rejected')">Reject</button>`:""}</div></article>`}).join("")||'<div class="empty">No withdrawal requests.</div>');window.processRequest=async(id,decision)=>{const transactionId=decision==="approved"?prompt("Enter transfer transaction ID:"):"",reason=decision==="rejected"?prompt("Enter rejection reason:"):"";if(decision==="approved"&&!transactionId)return;const token=await getIdToken(auth.currentUser),r=await fetch("https://asia-south1-magneetoz.cloudfunctions.net/adminProcessRiderWithdrawal",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({withdrawalId:id,decision,transactionId,reason})}),data=await r.json();if(!r.ok)alert(data.error||"Failed")};</script></body></html>
