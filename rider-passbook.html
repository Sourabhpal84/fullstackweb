<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Rider Passbook</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="rider-finance.css"></head><body><main class="wrap"><header class="head"><div><h1>Passbook</h1><p>Every earning, collection, settlement and withdrawal.</p></div><button onclick="location.href='rider-dashboard.html'">Dashboard</button></header><section class="list" id="list"></section></main><script type="module">
import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{collection,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0),date=v=>v?.toDate?.().toLocaleString("en-IN")||"Pending";
onAuthStateChanged(auth,u=>{if(!u)return location.replace("rider-login.html");onSnapshot(query(collection(db,"riderLedger"),where("riderId","==",u.uid)),s=>{const rows=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));list.innerHTML=rows.map(x=>{const sign=x.direction==="debit"?"-":x.direction==="credit"?"+":"";return `<article class="row"><div><b>${String(x.type||"Transaction").replaceAll("_"," ")}</b><div class="muted">${x.description||""}</div></div><b class="${x.direction||""}">${sign}${money(x.amount)}</b><span>${x.orderId?`Order #${x.orderId}`:""}</span><span>${x.transactionId||""}</span><span>${x.status||""}</span><span>${date(x.createdAt)}</span></article>`}).join("")||'<div class="empty">No passbook entries yet.</div>'})});</script></body></html>
