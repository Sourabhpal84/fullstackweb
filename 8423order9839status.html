  <script type="module">
import { protectAdminPage, mountAdminLogout } from "./admin-guard.js";
import { auth, db } from "./firebase-config.js";
import { getIdToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
  deleteDoc, getDoc, getDocs, 
  collection, onSnapshot, updateDoc, doc, query, where, serverTimestamp, deleteField, setDoc, addDoc, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
let onlineRiders = [];
let ordersUnsub = null;
const incomingOrderAlarm = new Audio("order-alert.mpeg");
incomingOrderAlarm.loop = true;
incomingOrderAlarm.preload = "auto";
let incomingOrderAlarmIds = new Set();
let incomingOrderAlarmUnlocked = false;
let kitchenWakeLock = null;
let kitchenAlarmEnabled = false;
let pendingAlarmReminderTimer = null;
let latestPendingOrders = [];
let latestActiveOrders = [];
let menuDishCache = [];
let currentOrderFilter = "Pending";
let currentOrderDateKey = todayKey();
const FUNCTIONS_BASE_URL = "https://asia-south1-magneetoz.cloudfunctions.net";
protectAdminPage();
mountAdminLogout(document.body);
const riderControlledStatuses = new Set(["Picked Up","Out For Delivery","Reached Nearby","Collect Payment","Payment Completed","Delivered"]);
const STATUS_FLOW = ["Payment Pending","Pending","Accepted","Preparing","Ready","Searching For Rider","Rider Accepted","Picked Up","Out For Delivery","Reached Nearby","Payment Completed","Delivered"];

function logStructured(scope, detail = {}){
  console.info(`[${scope}]`, detail);
}

function normalizeStatus(status){
  const key = String(status || "").toLowerCase();
  const map = {
    payment_pending:"Payment Pending",
    placed:"Pending",
    restaurant_accepted:"Accepted",
    preparing:"Preparing",
    ready_for_pickup:"Ready",
    rider_searching:"Searching For Rider",
    rider_assigned:"Rider Accepted",
    rider_accepted:"Rider Accepted",
    rider_arrived_restaurant:"Rider Accepted",
    picked_up:"Picked Up",
    out_for_delivery:"Out For Delivery",
    arrived_customer:"Reached Nearby",
    delivered:"Delivered",
    cancelled:"Cancelled",
    failed:"Failed"
  };
  if(map[key]) return map[key];
  if(status === "Ready") return "Ready";
  if(status === "Assigned To Delivery Boy") return "Rider Accepted";
  if(status === "Collect Payment") return "Reached Nearby";
  return status || "Pending";
}

function statusRank(status){
  const index = STATUS_FLOW.indexOf(normalizeStatus(status));
  return index < 0 ? 0 : index;
}

function toast(message){
  const node = document.getElementById("opsToast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(node._t);
  node._t = setTimeout(() => node.classList.remove("show"), 2600);
}

function terminalOrder(status){
  return ["Delivered","Rejected","Cancelled","Failed"].includes(normalizeStatus(status));
}

function adminAlertPhone(){
  return String(localStorage.getItem("magneetozAdminAlertPhone") || "").replace(/\D/g, "").slice(-10);
}

function renderGoLiveChecklist(){
  const phone = adminAlertPhone();
  const items = [
    { label:"Kitchen alarm", ok:kitchenAlarmEnabled },
    { label:"Admin WhatsApp", ok:phone.length === 10 },
    { label:"Online riders", ok:onlineRiders.length > 0, text:`${onlineRiders.length} online` },
    { label:"Pending orders", ok:latestPendingOrders.length === 0, warn:latestPendingOrders.length > 0, text:`${latestPendingOrders.length} pending` },
    { label:"Active orders", ok:true, text:`${latestActiveOrders.length} active` },
    { label:"Stock loaded", ok:menuDishCache.length > 0, text:`${menuDishCache.length} dishes` }
  ];
  const host = document.getElementById("goLiveChecklist");
  if(host) host.innerHTML = items.map(item => `<div class="go-live-item ${item.ok ? "ok" : "warn"}"><b>${item.ok ? "✓" : "!"} ${item.label}</b><br><span>${item.text || (item.ok ? "Ready" : "Needs attention")}</span></div>`).join("");
  const input = document.getElementById("adminAlertPhone");
  if(input && !input.value) input.value = phone;
}

window.saveAdminAlertPhone = function(){
  const value = String(document.getElementById("adminAlertPhone")?.value || "").replace(/\D/g, "").slice(-10);
  if(value.length !== 10){
    alert("Enter valid 10 digit mobile number.");
    return;
  }
  localStorage.setItem("magneetozAdminAlertPhone", value);
  renderGoLiveChecklist();
  toast("Admin alert number saved");
};

function adminWhatsAppLink(order = {}){
  const phone = adminAlertPhone();
  if(phone.length !== 10) return "";
  const text = `New MAGNEETOZ order #${order.orderNumber || order.orderId || order.id || ""} pending. Total ${formatCurrency(order.totalAmount || 0)}.`;
  return `https://wa.me/91${phone}?text=${encodeURIComponent(text)}`;
}

function unlockIncomingOrderAlarm(){
  if(incomingOrderAlarmUnlocked) return;
  incomingOrderAlarm.volume = 1;
  incomingOrderAlarm.play()
    .then(() => {
      incomingOrderAlarm.pause();
      incomingOrderAlarm.currentTime = 0;
      incomingOrderAlarmUnlocked = true;
    })
    .catch(() => {});
}

function setKitchenAlarmStatus(message, enabled = kitchenAlarmEnabled){
  const status = document.getElementById("kitchenAlarmStatus");
  const bar = document.getElementById("kitchenAlarmBar");
  const button = document.getElementById("enableKitchenAlarmBtn");
  if(status) status.textContent = message;
  bar?.classList.toggle("enabled", !!enabled);
  if(button) button.textContent = enabled ? "Alarm Enabled" : "Enable Alarm";
}

async function requestKitchenWakeLock(){
  if(!("wakeLock" in navigator)){
    setKitchenAlarmStatus("Alarm enabled. Browser wake lock is not supported here; keep laptop sleep disabled.", true);
    return;
  }
  try{
    kitchenWakeLock = await navigator.wakeLock.request("screen");
    kitchenWakeLock.addEventListener("release", () => {
      kitchenWakeLock = null;
      if(kitchenAlarmEnabled && !document.hidden) requestKitchenWakeLock();
    });
    setKitchenAlarmStatus("Alarm enabled. Screen will stay awake while this page is open.", true);
  }catch(error){
    console.warn("Wake lock unavailable:", error);
    setKitchenAlarmStatus("Alarm enabled. Please keep laptop sleep disabled if wake lock is blocked.", true);
  }
}

async function enableKitchenAlarm(){
  kitchenAlarmEnabled = true;
  unlockIncomingOrderAlarm();
  await requestKitchenWakeLock();
  toast("Kitchen alarm enabled");
}

document.getElementById("enableKitchenAlarmBtn")?.addEventListener("click", enableKitchenAlarm);
document.addEventListener("visibilitychange", () => {
  if(kitchenAlarmEnabled && !document.hidden && !kitchenWakeLock) requestKitchenWakeLock();
});

["click","touchstart","keydown"].forEach(eventName => {
  window.addEventListener(eventName, unlockIncomingOrderAlarm, { once:true, passive:true });
});

function syncIncomingOrderAlarm(pendingOrders = []){
  const nextIds = new Set(pendingOrders.map(order => order.id));
  const newest = pendingOrders
    .filter(order => !incomingOrderAlarmIds.has(order.id))
    .sort((a,b) => tsMillis(b.createdAt) - tsMillis(a.createdAt))[0];
  incomingOrderAlarmIds = nextIds;
  if(!pendingOrders.length){
    incomingOrderAlarm.pause();
    incomingOrderAlarm.currentTime = 0;
    clearInterval(pendingAlarmReminderTimer);
    pendingAlarmReminderTimer = null;
    document.title = "Orders | MAGNEETOZ";
    return;
  }
  const current = newest || pendingOrders[0];
  const orderNumber = current.orderNumber || current.orderId || current.id;
  document.title = `Order #${orderNumber} received | MAGNEETOZ`;
  toast(`Order #${orderNumber} received`);
  incomingOrderAlarm.play().catch(() => {});
  if(!pendingAlarmReminderTimer){
    pendingAlarmReminderTimer = setInterval(() => {
      if(!incomingOrderAlarmIds.size) return;
      incomingOrderAlarm.currentTime = 0;
      incomingOrderAlarm.play().catch(() => {});
    }, 45000);
  }
}

async function callAdminFunction(name, payload = {}, timeoutMs = 25000){
  const user = auth.currentUser;
  if(!user) throw new Error("Please login again.");
  const token = await getIdToken(user, true);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try{
    const response = await fetch(`${FUNCTIONS_BASE_URL}/${name}`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${token}`
      },
      body:JSON.stringify(payload),
      signal:controller.signal
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok || data.ok === false) throw new Error(data.error || "Request failed.");
    return data;
  }finally{
    clearTimeout(timer);
  }
}

function formatCurrency(amount){
  return new Intl.NumberFormat("en-IN", {
    style:"currency",
    currency:"INR",
    maximumFractionDigits:0
  }).format(Number(amount) || 0);
}

function escapeHTML(value = ""){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function todayKey(){
  const now = new Date();
  return dateKeyFromDate(now);
}

function dateKeyFromDate(date){
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function orderDateKey(order = {}){
  const millis = tsMillis(order.createdAt || order.orderCreatedAt || order.placedAt || order.timestamp || order.date);
  return millis ? dateKeyFromDate(new Date(millis)) : "";
}

function setOrderDate(value){
  currentOrderDateKey = value || todayKey();
  const input = document.getElementById("orderDateFilter");
  if(input) input.value = currentOrderDateKey;
  loadOrders(currentOrderFilter || "Active");
}

window.setOrderDate = setOrderDate;

window.todayKey = todayKey;

window.shiftOrderDate = function(days){
  const base = currentOrderDateKey ? new Date(`${currentOrderDateKey}T00:00:00`) : new Date();
  base.setDate(base.getDate() + Number(days || 0));
  setOrderDate(dateKeyFromDate(base));
};

function itemQty(item = {}){
  return Number(item.qty ?? item.quantity ?? item.count ?? 1) || 1;
}

function itemUnitAmount(item = {}){
  const direct = item.baseUnitPrice ?? item.unitPrice ?? item.basePrice ?? item.selectedPrice ?? item.variantPrice ?? item.finalPrice;
  if(Number(direct) > 0) return Number(direct);
  const line = item.total ?? item.totalPrice ?? item.lineTotal ?? item.amount;
  if(Number(line) > 0) return Number(line) / itemQty(item);
  return 0;
}

function itemLineAmount(item = {}){
  const line = item.total ?? item.totalPrice ?? item.lineTotal ?? item.amount;
  if(Number(line) > 0) return Number(line);
  return itemUnitAmount(item) * itemQty(item);
}

function itemExtras(item = {}){
  const extras = Array.isArray(item.extras) ? item.extras : (Array.isArray(item.addOns) ? item.addOns : []);
  return extras.filter(extra => extra && extra.name);
}

function itemCrust(item = {}){
  if(item.crust && typeof item.crust === "object"){
    return item.crust.label || item.crust.name || "Pan Crust";
  }
  return item.crustType || item.selectedCrust || "Pan Crust";
}

function itemBaseLineAmount(item = {}){
  const qty = itemQty(item);
  const base = itemUnitAmount(item);
  if(base > 0) return base * qty;
  const extrasTotal = itemExtras(item).reduce((sum, extra) => sum + Number(extra.price || 0), 0) * qty;
  return Math.max(0, itemLineAmount(item) - extrasTotal);
}

function renderOrderItems(items = []){
  if(!Array.isArray(items) || !items.length) return "<div>No items found</div>";
  return items.map(item => {
    const qty = itemQty(item);
    const line = itemLineAmount(item);
    const itemName = escapeHTML(item.name || item.title || item.dishName || "Item");
    const amountText = line > 0 ? formatCurrency(line) : "-";
    const extras = itemExtras(item);
    const baseLine = itemBaseLineAmount(item);
    const crustText = `<small style="grid-column:1/-1;color:#94a3b8;">Crust: ${escapeHTML(itemCrust(item))}</small>`;
    const baseText = `<small style="grid-column:1/-1;color:#94a3b8;">Base: ${formatCurrency(baseLine)}</small>`;
    const extrasText = extras.length
      ? `<small style="grid-column:1/-1;color:#94a3b8;">Extras: ${extras.map(extra => `${escapeHTML(extra.name)} ${formatCurrency(Number(extra.price || 0) * qty)}`).join(", ")}</small>`
      : "";
    return `<div class="item-line"><span>• ${itemName} (x${qty})</span><b>${amountText}</b>${crustText}${baseText}${extrasText}</div>`;
  }).join("");
}

function paymentBadge(order = {}){
  const method = String(order.paymentMethod || order.paymentMode || "").toLowerCase();
  const status = String(order.paymentStatus || "").toLowerCase();
  const captured = order.paymentCaptured === true || !!order.razorpayPaymentId;
  if((method === "online" || method === "upi") && (status === "paid" || captured)){
    return { cls:"paid", label:"PAID ONLINE" };
  }
  if(method === "cod" || method === "cash"){
    return { cls:"cod", label:"COD" };
  }
  return { cls:"pending", label:"PAYMENT PENDING" };
}

function isPaidOnline(order = {}){
  const badge = paymentBadge(order);
  return badge.cls === "paid";
}

function isUnpaidOnline(order = {}){
  const method = String(order.paymentMethod || order.paymentMode || "").toLowerCase();
  const status = String(order.paymentStatus || "").toLowerCase();
  return (method === "online" || method === "upi") && status !== "paid" && order.paymentCaptured !== true && !order.razorpayPaymentId;
}

function tsMillis(value){
  if(!value) return 0;
  if(typeof value.toMillis === "function") return value.toMillis();
  if(value.seconds) return Number(value.seconds) * 1000;
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? parsed : 0;
}

function riderPresence(rider = {}){
  const onlineFlag = rider.online === true
    || rider.isOnline === true
    || rider.status === "online"
    || rider.availabilityStatus === "online";
  const lastSeen = Math.max(
    tsMillis(rider.lastSeenAt),
    tsMillis(rider.lastLocationUpdateAt),
    tsMillis(rider.location?.updatedAt),
    tsMillis(rider.currentLocation?.updatedAt)
  );
  const stale = onlineFlag && lastSeen && Date.now() - lastSeen > 5 * 60 * 1000;
  const busy = !!(rider.currentActiveOrderId || rider.activeOrderId);
  return {
    onlineFlag,
    stale,
    busy,
    assignable:onlineFlag && !stale && !busy,
    label:!onlineFlag ? "Offline" : stale ? "Location stale" : busy ? "Busy" : "Online"
  };
}

window.saveRestaurantLocation = async function(){
  const lat = Number(document.getElementById("restaurantLatitude").value);
  const lng = Number(document.getElementById("restaurantLongitude").value);
  if(!Number.isFinite(lat) || !Number.isFinite(lng)){
    alert("Enter valid latitude and longitude.");
    return;
  }
  await setDoc(doc(db,"settings","restaurant"), {
    location:{ lat, lng },
    lastLocationUpdatedAt:serverTimestamp()
  }, { merge:true });
  const saved = await getDoc(doc(db,"settings","restaurant"));
  const savedLocation = saved.data()?.location || {};
  if(Number(savedLocation.lat) !== lat || Number(savedLocation.lng) !== lng){
    throw new Error("Restaurant location save verification failed.");
  }
  toast("Restaurant location saved");
};

window.useCurrentRestaurantLocation = async function(){
  if(!navigator.geolocation){
    alert("Location is not supported on this device/browser.");
    return;
  }
  const ok = confirm("Stand at the restaurant/store location, then allow location access. Use this device's live location as restaurant location?");
  if(!ok) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = Number(pos.coords.latitude.toFixed(6));
    const lng = Number(pos.coords.longitude.toFixed(6));
    document.getElementById("restaurantLatitude").value = lat;
    document.getElementById("restaurantLongitude").value = lng;
    await saveRestaurantLocation();
  }, error => {
    alert(error?.message || "Unable to fetch current location.");
  }, {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:0
  });
};

window.loadOrders = function(filter) {
  currentOrderFilter = filter;
  document.querySelectorAll("#filters button").forEach(btn => {
    btn.classList.toggle("active", btn.textContent.trim() === filter || (filter === "Reached Nearby" && btn.textContent.trim() === "Nearby") || (filter === "Payment Completed" && btn.textContent.trim() === "Payment Done") || (filter === "Rider Accepted" && btn.textContent.trim() === "Rider Assigned"));
  });

  if(dateInput && !dateInput.value) dateInput.value = currentOrderDateKey;
  const q = query(collection(db, "orders"), where("orderSource", "==", "online"));
  ordersUnsub?.();
  ordersUnsub = onSnapshot(q, (snap) => {
    const container = document.getElementById("orders");
    container.innerHTML = "";
    const docs = [];
    snap.forEach(docSnap => docs.push(docSnap));
    const allOrders = docs.map(docSnap => ({ id:docSnap.id, ...docSnap.data() }));
    const dateOrders = allOrders.filter(order => orderDateKey(order) === currentOrderDateKey);
    latestPendingOrders = dateOrders.filter(order => {
      const status = normalizeStatus(order.status || order.orderStatus || "Pending");
      return status === "Pending" && !isUnpaidOnline(order);
    });
    latestActiveOrders = dateOrders.filter(order => !terminalOrder(order.status || order.orderStatus || "Pending"));
    syncIncomingOrderAlarm(latestPendingOrders);
    renderGoLiveChecklist();
    let rendered = 0;
    docs
      .sort((a,b) => tsMillis(b.data().createdAt) - tsMillis(a.data().createdAt))
      .forEach(docSnap => {
      const d = docSnap.data();
      if(orderDateKey(d) !== currentOrderDateKey) return;
      const displayStatus = normalizeStatus(d.status || d.orderStatus || "Pending");
      const paidProof = String(d.paymentStatus || "").toLowerCase() === "paid" || d.paymentCaptured === true || !!d.razorpayPaymentId;
      const method = paidProof ? "online" : String(d.paymentMethod || d.paymentMode || "").toLowerCase();
      const paidOnline = (method === "online" || method === "upi") && paidProof;
      const pendingOnlineDraft = (method === "online" || method === "upi") && !paidOnline;
      if(pendingOnlineDraft && filter !== "Payment Pending") return;
      if(filter === "Active" && terminalOrder(displayStatus)) return;
      if (filter !== "All" && filter !== "Active" && displayStatus !== normalizeStatus(filter)) return;
      rendered += 1;
      const badge = paymentBadge(d);
      const paymentLocked = isUnpaidOnline(d);
      const waLink = displayStatus === "Pending" ? adminWhatsAppLink({ id:docSnap.id, ...d }) : "";
      
      container.innerHTML += `
        <div class="order-card">
          <span class="status-badge ${displayStatus}">${displayStatus}</span>
          <span class="payment-badge ${badge.cls}">${badge.label}</span>
          <h3>#${d.orderNumber || d.orderId} - ${d.customerName}</h3>
          <div class="info-row">📅 ${orderDateKey(d) || "No date"}</div>
          <div class="info-row">📞 ${d.phone}</div>
          ${waLink ? `<a class="wa-alert-btn" href="${waLink}" target="_blank" rel="noopener">Send admin WhatsApp alert</a>` : ""}
          <div class="info-row">🏠 ${d.address}</div>
          <div class="items-list">${renderOrderItems(d.items)}</div>
          <div style="font-weight:700; color:var(--accent);">Total: ${formatCurrency(d.totalAmount)}</div>
          <div class="assigned-rider">
            Order value: ${formatCurrency(d.subtotalAmount || d.subtotal || 0)}<br>
            Distance: ${Number(d.distanceKm || d.deliveryDistance || 0).toFixed(1)} KM<br>
            Delivery fee: ${Number(d.deliveryFee ?? d.deliveryCharge ?? 0) > 0 ? formatCurrency(d.deliveryFee ?? d.deliveryCharge) : "FREE"}<br>
            Free delivery: ${(d.freeDeliveryApplied ?? d.freeDelivery) ? "Yes" : "No"}<br>
            Threshold used: ${formatCurrency(d.freeDeliveryThreshold || 0)}<br>
            Serviceable: ${d.deliveryServiceable === false ? "No" : "Yes"}
          </div>
          <div class="assigned-rider">Payment: ${paidOnline ? "paid (online)" : `${d.paymentStatus || "pending"} ${d.paymentMethod ? `(${d.paymentMethod})` : ""}`}<br>Amount to collect: ${formatCurrency(paidOnline ? 0 : (d.amountToCollect ?? d.totalAmount ?? 0))}<br>Coupon: ${d.couponCode || "None"} ${d.couponDiscount ? `- ${formatCurrency(d.couponDiscount)}` : ""}</div>
          ${d.riderName || d.assignedRider?.name ? `<div class="assigned-rider">Rider: ${d.riderName || d.assignedRider.name}<br>${d.riderPhone || d.assignedRider?.phone || ""}</div>` : ""}
          <div class="btn-group status-grid">

  <button
    class="btn-status ${paymentLocked ? "locked" : ""}"
    ${paymentLocked ? `title="Online payment is not confirmed yet" onclick="paymentPendingLocked()"` : `onclick="updateStatus('${docSnap.id}','Accepted')"`}>

    ✅ Accept

  </button>

  <button
    class="btn-status ${paymentLocked ? "locked" : ""}"
    ${paymentLocked ? `title="Online payment is not confirmed yet" onclick="paymentPendingLocked()"` : `onclick="updateStatus('${docSnap.id}','Preparing')"`}>

    👨‍🍳 Preparing

  </button>

  <button
    class="btn-status ${paymentLocked ? "locked" : ""}"
    ${paymentLocked ? `title="Online payment is not confirmed yet" onclick="paymentPendingLocked()"` : `onclick="markReadyForPickup('${docSnap.id}')"`}>

    ✅ Ready

  </button>

  <button
    class="btn-status"
    onclick="requestNearbyRiders('${docSnap.id}')">

    🚚 Searching For Rider

  </button>

  <button
    class="btn-status"
    onclick="openManualAssign('${docSnap.id}')">

    Assign Rider

  </button>

  <button class="btn-status locked" title="Controlled by Rider" onclick="lockedRiderStage()">🔒 Picked Up</button>
  <button class="btn-status locked" title="Controlled by Rider" onclick="lockedRiderStage()">🔒 Out For Delivery</button>
  <button class="btn-status locked" title="Controlled by Rider" onclick="lockedRiderStage()">🔒 Nearby</button>
  <button class="btn-status locked" title="Controlled by Rider" onclick="lockedRiderStage()">🔒 Payment Done</button>
  <button class="btn-status btn-delivered locked" title="Controlled by Rider" onclick="lockedRiderStage()">🔒 Delivered</button>

  <button
    class="btn-status btn-reject"
    onclick="updateStatus('${docSnap.id}','Rejected')">

    ❌ Reject

  </button>

</div>
        </div>`;
    });
    if(!rendered){
      container.innerHTML = `<div class="empty-orders">No ${filter.toLowerCase()} orders for ${currentOrderDateKey}.</div>`;
    }
  }, error => console.warn("[FIRESTORE LISTENER] Admin orders failed", error));
}

    toast(`Order moved to ${result.status || nextStatus}`);

    alert(error.message || "Unable to update order status.");
  }
};

    const order = docSnap.data();

};

window.openManualAssign = async function(orderId){
  const candidates = onlineRiders;
  if(!candidates.length){
    alert("No active riders are online.");
    return;
  }
  const list = candidates
    .map((rider, index) => {
      const presence = riderPresence(rider);
      return `${index + 1}. ${rider.name || rider.riderName || "Magneetoz Rider"} (${rider.phone || rider.phoneDigits || "no phone"}) - ${presence.label}`;
    })
    .join("\n");
  const choice = prompt(`Assign order to rider:\n\n${list}\n\nEnter rider number`);
  if(!choice) return;
  const rider = candidates[Number(choice) - 1];
  if(!rider){
    alert("Invalid rider selection.");
    return;
  }
  await assignSpecificRider(orderId, rider);
};

async function assignSpecificRider(orderId, rider){
  try{
    const presence = riderPresence(rider);
    const overrideOffline = !presence.onlineFlag
      ? confirm("Selected rider is offline. Assign anyway?")
      : false;
    const result = await callAdminFunction("assignRiderToOrder", { orderId, riderId:rider.id, overrideOffline });
    toast(result.skipped ? "Rider already assigned" : (result.message || "Rider assigned successfully."));
  }catch(error){
    alert(error.message || "Unable to assign rider.");
  }
}

window.requestNearbyRiders = async function(orderId){
  const orderRef = doc(db, "orders", orderId);
  const orderSnap = await getDoc(orderRef);
  if(!orderSnap.exists()){
    alert("Order not found.");
    return;
  }
  const order = orderSnap.data();
  if(isUnpaidOnline(order)){
    alert("Online payment is not confirmed yet. Do not assign rider.");
    return;
  }
  if(!["Accepted","Preparing","Ready","ready_for_pickup","Searching For Rider","rider_searching"].includes(order.status)){
    alert("Accept or mark order Preparing before searching rider.");
    return;
  }
  if(order.assignedRiderId || order.riderId){
    alert("A rider is already assigned.");
    return;
  }
  const paymentFix = {};
  const badge = paymentBadge(order);
  if(badge.cls === "paid"){
    paymentFix.paymentStatus = "paid";
    paymentFix.paymentMethod = "online";
    paymentFix.paymentCaptured = true;
    paymentFix.amountToCollect = 0;
  }
  logStructured("RIDER ASSIGNMENT", {
    orderId,
    candidates:"backend_route_selection_pending",
    paymentStatus:paymentFix.paymentStatus || order.paymentStatus || "pending",
    amountToCollect:paymentFix.amountToCollect ?? order.amountToCollect ?? order.totalAmount ?? 0
  });

  try{
    const result = await callAdminFunction("assignRiderToOrder", { orderId });
    toast(result.skipped ? "Rider already assigned" : (result.message || `Rider request sent: ${result.riderName || "Magneetoz Rider"}`));
  }catch(error){
    alert(error.message || "No rider is online right now.");
  }
  logStructured("RIDER MATCHING", { orderId, source:"backend_google_routes" });
};
