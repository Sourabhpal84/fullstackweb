<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Settlement History</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="rider-finance.css"></head><body><main class="wrap"><header class="head"><div><h1>Settlement History</h1><p>Company settlements and transaction references.</p></div><button onclick="location.href='rider-dashboard.html'">Dashboard</button></header><section class="list" id="list"></section></main><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{collection,onSnapshot,orderBy,query,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0),dt=v=>v?.toDate?.().toLocaleString("en-IN")||"Pending";onAuthStateChanged(auth,u=>{if(!u)return location.replace("rider-login.html");onSnapshot(query(collection(db,"riderSettlements"),where("riderId","==",u.uid),orderBy("createdAt","desc")),s=>list.innerHTML=s.docs.map(d=>{const x=d.data();return `<article class="row"><div><b>${dt(x.createdAt)}</b><div class="muted">${d.id}</div></div><b>${money(x.amount||x.upiPaid||x.companyReceivedAmount)}</b><span>${x.payoutMethod||x.method||"Razorpay"}</span><span>${x.transactionId||x.razorpayPaymentId||"-"}</span><span>${x.status||x.payoutStatus||"Success"}</span><span>${x.type||"Settlement"}</span></article>`}).join("")||'<div class="empty">No settlements yet.</div>')});</script></body></html>
